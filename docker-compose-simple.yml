# SIMPLER VERSION: Ollama runs locally on Mac, backend + frontend in Docker
# Use this if you prefer to manage Ollama separately with "ollama serve"

services:
  raglab-frontend:
    image: nginx:alpine
    container_name: raglab-frontend
    ports:
      - "8080:80"
    volumes:
      # frontend/index.html calls the backend at 127.0.0.1:5050 directly from
      # the browser, so this container only needs to serve the static file -
      # it doesn't need to be on the same Docker network as the backend
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped

  raglab-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raglab-backend
    ports:
      # Host port is 5050, not 5000 - macOS AirPlay Receiver holds 5000 on
      # 0.0.0.0 (System Settings > General > AirDrop & Handoff), which blocks
      # Docker's port publish. The container still listens on 5000 internally.
      - "5050:5000"
    environment:
      - FLASK_APP=backend_server.py
      - FLASK_ENV=production
      # 0.0.0.0 so Docker's port-forwarded traffic (arriving on the
      # container's external interface) actually reaches Flask - binding to
      # 'localhost' only listens on loopback and silently drops it
      - FLASK_RUN_HOST=0.0.0.0
      # Point to Ollama running on host machine
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
      - ./rag_results.jsonl:/app/rag_results.jsonl
    restart: unless-stopped
    healthcheck:
      # python, not curl - the python:3.14-slim base image doesn't have curl
      # installed, so a curl-based healthcheck always fails with "not found"
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
