<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAGLab - Retrieval-Augmented Generation Interface</title>
    <!-- Libraries are vendored locally under frontend/vendor/ and served by the
         Flask backend, so the app needs NO internet/CDN and renders in any
         browser (no ad-blocker/extension can strip the scripts). -->
    <script src="/vendor/react.production.min.js"></script>
    <script src="/vendor/react-dom.production.min.js"></script>
    <!-- Babel compiles the in-page JSX below; without it the
         <script type="text/babel"> block throws "Unexpected token '<'" -->
    <script src="/vendor/babel.min.js"></script>
    <script src="/vendor/tailwind.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
        
        .scrollable {
            scrollbar-width: thin;
            scrollbar-color: #475569 #1e293b;
        }
        
        .scrollable::-webkit-scrollbar {
            width: 8px;
        }
        
        .scrollable::-webkit-scrollbar-track {
            background: #1e293b;
        }
        
        .scrollable::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        
        .scrollable::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        
        .spin {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .upload-zone {
            border: 2px dashed #64748b;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-zone:hover {
            border-color: #fbbf24;
            background-color: rgba(251, 191, 36, 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-black text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        
        // 127.0.0.1 (not localhost) forces IPv4 to match the Flask bind, and
        // 5050 avoids macOS AirPlay Receiver which holds port 5000
        const API_BASE = 'http://127.0.0.1:5050';

        function RAGLabInterface() {
            const [question, setQuestion] = useState('');
            const [response, setResponse] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [history, setHistory] = useState([]);
            const [uploading, setUploading] = useState(false);
            const [uploadError, setUploadError] = useState(null);
            const [documents, setDocuments] = useState([]);
            const [showDocs, setShowDocs] = useState(false);
            const [docBusy, setDocBusy] = useState(false);
            const fileInputRef = useRef(null);
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            useEffect(() => {
                scrollToBottom();
            }, [history]);

            // Load the document list once on mount
            useEffect(() => {
                fetchDocuments();
            }, []);

            const fetchDocuments = async () => {
                try {
                    const res = await fetch(`${API_BASE}/list-documents`);
                    if (!res.ok) throw new Error('Failed to load documents');
                    const data = await res.json();
                    setDocuments(data.documents || []);
                } catch (err) {
                    // Non-fatal: the panel just shows empty if the backend is down
                    console.error('list-documents error:', err);
                }
            };

            const handleDeleteDocument = async (name) => {
                if (!window.confirm(`Delete "${name}" and re-index the remaining documents?`)) return;
                setError(null);
                // Optimistic update: the backend deletes the file, THEN re-embeds
                // the rest (slow). Remove it from the list right away so the UI
                // updates instantly — no waiting on the re-index, no manual reload.
                setDocuments(prev => prev.filter(d => d.name !== name));
                setDocBusy(true);
                try {
                    const res = await fetch(`${API_BASE}/delete-document`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: name }),
                    });
                    if (!res.ok) {
                        const data = await res.json().catch(() => ({}));
                        throw new Error(data.error || 'Delete failed');
                    }
                } catch (err) {
                    setError(err.message || 'Delete failed');
                } finally {
                    // Re-sync with server truth. /list-documents reads the data/
                    // folder, which already reflects the deletion even while the
                    // re-index is still running — so the list is correct whether
                    // the request succeeded, timed out, or errored.
                    fetchDocuments();
                    setDocBusy(false);
                }
            };

            const handleClearAll = async () => {
                if (!window.confirm('Delete ALL documents and clear the vector store? This cannot be undone.')) return;
                setDocBusy(true);
                setError(null);
                try {
                    const res = await fetch(`${API_BASE}/clear-all-documents`, { method: 'POST' });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Clear failed');
                    await fetchDocuments();
                } catch (err) {
                    setError(err.message || 'Clear failed');
                } finally {
                    setDocBusy(false);
                }
            };

            const handleFileUpload = async (e) => {
                const files = e.target.files;
                if (!files) return;

                setUploading(true);
                setUploadError(null);

                try {
                    const formData = new FormData();
                    for (let i = 0; i < files.length; i++) {
                        formData.append('files', files[i]);
                    }

                    const res = await fetch(`${API_BASE}/upload`, {
                        method: 'POST',
                        body: formData,
                    });

                    if (!res.ok) throw new Error('Upload failed');
                    const data = await res.json();

                    setError(null);
                    setHistory([...history, {
                        question: `📁 Uploaded ${data.count} document(s)`,
                        response: { response: data.message || 'Documents indexed successfully!', metrics: null }
                    }]);
                    fetchDocuments();
                } catch (err) {
                    setUploadError(err.message || 'Upload failed');
                } finally {
                    setUploading(false);
                    if (fileInputRef.current) fileInputRef.current.value = '';
                }
            };

            const handleQuery = async (e) => {
                e.preventDefault();
                const q = question.trim();
                if (!q) return;

                setLoading(true);
                setError(null);
                setQuestion('');

                // Add a placeholder we fill as the stream arrives (sources first,
                // then the answer token-by-token, then final metrics).
                let idx = 0;
                setHistory(h => {
                    idx = h.length;
                    return [...h, { question: q, streaming: true,
                                    response: { response: '', retrieved_chunks: [], metrics: null } }];
                });
                const patch = (fields) => setHistory(h => {
                    const c = [...h];
                    if (c[idx]) c[idx] = { ...c[idx], response: { ...c[idx].response, ...fields } };
                    return c;
                });

                try {
                    const res = await fetch(`${API_BASE}/query-stream`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question: q }),
                    });
                    if (!res.ok || !res.body) throw new Error('Failed to fetch response');

                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '', answer = '';
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });
                        let nl;
                        while ((nl = buffer.indexOf('\n')) >= 0) {
                            const line = buffer.slice(0, nl).trim();
                            buffer = buffer.slice(nl + 1);
                            if (!line) continue;
                            let evt;
                            try { evt = JSON.parse(line); } catch (_) { continue; }
                            if (evt.type === 'context') {
                                patch({ retrieved_chunks: evt.retrieved_chunks || [] });
                            } else if (evt.type === 'token') {
                                answer += evt.text || '';
                                patch({ response: answer });
                            } else if (evt.type === 'done') {
                                patch({ response: evt.response, retrieved_chunks: evt.retrieved_chunks, metrics: evt.metrics });
                                setHistory(h => { const c = [...h]; if (c[idx]) c[idx] = { ...c[idx], streaming: false }; return c; });
                            } else if (evt.type === 'error') {
                                throw new Error(evt.error || 'stream error');
                            }
                        }
                    }
                } catch (err) {
                    setError(err.message || 'Something went wrong. Make sure backend is running on http://127.0.0.1:5050');
                    setHistory(h => { const c = [...h]; if (c[idx]) c[idx] = { ...c[idx], streaming: false }; return c; });
                    console.error('Error:', err);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <div className="border-b border-slate-700 bg-slate-900/50 backdrop-blur-sm sticky top-0 z-10">
                        <div className="max-w-4xl mx-auto px-6 py-4 w-full">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-yellow-400 to-yellow-600 rounded-lg flex items-center justify-center">
                                    <span className="text-lg font-bold text-black">⚡</span>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-bold">RAGLab</h1>
                                    <p className="text-xs text-slate-400">Retrieval-Augmented Generation System</p>
                                </div>
                                <button
                                    onClick={() => setShowDocs(!showDocs)}
                                    className="ml-auto text-sm bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-full px-4 py-2 transition flex items-center gap-2"
                                >
                                    📚 Documents
                                    <span className="bg-yellow-500 text-black text-xs font-bold rounded-full px-2 py-0.5">{documents.length}</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Main Container */}
                    <div className="flex-1 flex flex-col max-w-4xl mx-auto px-6 w-full py-8">
                        {/* Document Manager Panel */}
                        {showDocs && (
                            <div className="bg-slate-900 border border-slate-700 rounded-xl p-4 mb-6 fade-in">
                                <div className="flex items-center justify-between mb-3">
                                    <p className="text-sm font-semibold text-slate-300">
                                        📚 Indexed Documents ({documents.length})
                                    </p>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={fetchDocuments}
                                            disabled={docBusy}
                                            className="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded px-3 py-1 transition disabled:opacity-50"
                                        >
                                            ↻ Refresh
                                        </button>
                                        <button
                                            onClick={handleClearAll}
                                            disabled={docBusy || documents.length === 0}
                                            className="text-xs bg-red-900/60 hover:bg-red-800 border border-red-700 rounded px-3 py-1 transition disabled:opacity-40"
                                        >
                                            🗑 Clear all
                                        </button>
                                    </div>
                                </div>
                                {docBusy && <p className="text-xs text-yellow-400 mb-2">Re-indexing… this can take a moment.</p>}
                                {documents.length === 0 ? (
                                    <p className="text-xs text-slate-500 py-4 text-center">No documents indexed. Upload one below.</p>
                                ) : (
                                    <div className="space-y-2 max-h-60 overflow-y-auto scrollable">
                                        {documents.map((doc, i) => (
                                            <div key={i} className="flex items-center justify-between bg-slate-800 rounded-lg px-3 py-2 border border-slate-700">
                                                <div className="min-w-0">
                                                    <p className="text-sm text-slate-200 truncate">{doc.name}</p>
                                                    <p className="text-xs text-slate-500">{doc.size_mb} MB</p>
                                                </div>
                                                <button
                                                    onClick={() => handleDeleteDocument(doc.name)}
                                                    disabled={docBusy}
                                                    className="text-xs text-red-400 hover:text-red-300 hover:bg-red-900/40 rounded px-2 py-1 transition disabled:opacity-40 flex-shrink-0 ml-3"
                                                    title={`Delete ${doc.name}`}
                                                >
                                                    🗑 Delete
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Chat History */}
                        <div className="scrollable space-y-6 mb-8 flex-1 overflow-y-auto">
                            {history.length === 0 ? (
                                <div className="flex flex-col items-center justify-center py-12 text-center h-full">
                                    <div className="w-16 h-16 bg-gradient-to-br from-yellow-400/20 to-yellow-600/20 rounded-full flex items-center justify-center mb-4">
                                        <span className="text-3xl">🤖</span>
                                    </div>
                                    <h2 className="text-xl font-semibold mb-2">Welcome to RAGLab</h2>
                                    <p className="text-slate-400 text-sm">Ask a question to get started</p>
                                </div>
                            ) : (
                                history.map((item, idx) => (
                                    <div key={idx} className="space-y-4 fade-in">
                                        {/* User Question */}
                                        <div className="flex justify-end">
                                            <div className="bg-gradient-to-r from-yellow-500 to-yellow-600 rounded-2xl rounded-tr-none px-4 py-3 max-w-lg">
                                                <p className="text-sm font-medium text-black">{item.question}</p>
                                            </div>
                                        </div>

                                        {/* AI Response */}
                                        <div className="space-y-3">
                                            {/* Answer */}
                                            <div className="bg-slate-800 rounded-2xl rounded-tl-none p-4 border border-slate-700">
                                                <p className="text-sm text-slate-300 leading-relaxed whitespace-pre-wrap">
                                                    {item.response.response || (item.streaming ? 'Retrieving & thinking…' : '')}
                                                    {item.streaming && item.response.response ? <span className="animate-pulse">▊</span> : null}
                                                </p>
                                            </div>

                                            {/* Retrieved Documents */}
                                            {item.response.retrieved_chunks?.length > 0 && (
                                                <div className="bg-slate-900 rounded-xl p-4 border border-slate-700">
                                                    <p className="text-xs font-semibold text-slate-400 mb-3 uppercase tracking-wider">
                                                        📚 Retrieved Context
                                                    </p>
                                                    <div className="space-y-2">
                                                        {item.response.retrieved_chunks.map((chunk, i) => (
                                                            <div key={i} className="bg-slate-800 rounded-lg p-2 text-xs border border-slate-700">
                                                                <div className="flex justify-between items-start mb-1">
                                                                    <span className="font-semibold text-yellow-400">{chunk.source}</span>
                                                                    <span className="text-slate-400">
                                                                        {(chunk.similarity * 100).toFixed(1)}% match
                                                                    </span>
                                                                </div>
                                                                <p className="text-slate-400 line-clamp-2">{chunk.content.substring(0, 120)}...</p>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}

                                            {/* Metrics */}
                                            {item.response.metrics && (
                                                <div className="grid grid-cols-2 gap-3">
                                                    {/* Generation Metrics */}
                                                    <div className="bg-gradient-to-br from-blue-900/50 to-blue-800/50 rounded-xl p-3 border border-blue-700/50">
                                                        <p className="text-xs font-semibold text-blue-300 mb-2">Generation Quality</p>
                                                        <div className="space-y-1 text-xs">
                                                            <div className="flex justify-between">
                                                                <span className="text-slate-400">Relevance</span>
                                                                <span className="text-blue-300 font-semibold">
                                                                    {(item.response.metrics.generation?.relevance * 100).toFixed(0)}%
                                                                </span>
                                                            </div>
                                                            <div className="flex justify-between">
                                                                <span className="text-slate-400">Hallucination</span>
                                                                <span className={item.response.metrics.generation?.has_hallucination ? 'text-red-400' : 'text-green-400'}>
                                                                    {item.response.metrics.generation?.has_hallucination ? '⚠️ Detected' : '✓ None'}
                                                                </span>
                                                            </div>
                                                            <div className="flex justify-between">
                                                                <span className="text-slate-400">Response Time</span>
                                                                <span className="text-blue-300 font-semibold">
                                                                    {item.response.metrics.generation?.generation_time?.toFixed(2)}s
                                                                </span>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {/* Retrieval Metrics */}
                                                    <div className="bg-gradient-to-br from-purple-900/50 to-purple-800/50 rounded-xl p-3 border border-purple-700/50">
                                                        <p className="text-xs font-semibold text-purple-300 mb-2">Retrieval Quality</p>
                                                        <div className="space-y-1 text-xs">
                                                            <div className="flex justify-between">
                                                                <span className="text-slate-400">Avg Similarity</span>
                                                                <span className="text-purple-300 font-semibold">
                                                                    {(item.response.metrics.retrieval?.average_similarity * 100).toFixed(0)}%
                                                                </span>
                                                            </div>
                                                            <div className="flex justify-between">
                                                                <span className="text-slate-400">Chunks Retrieved</span>
                                                                <span className="text-purple-300 font-semibold">
                                                                    {item.response.metrics.retrieval?.num_retrieved}
                                                                </span>
                                                            </div>
                                                            <div className="flex justify-between">
                                                                <span className="text-slate-400">Retrieval Time</span>
                                                                <span className="text-purple-300 font-semibold">
                                                                    {item.response.metrics.retrieval?.retrieval_time?.toFixed(3)}s
                                                                </span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))
                            )}
                            <div ref={messagesEndRef} />
                        </div>

                        {/* Upload Error Message */}
                        {uploadError && (
                            <div className="bg-red-900/50 border border-red-700 rounded-lg p-4 mb-4 flex gap-3">
                                <span className="text-red-400 flex-shrink-0 text-lg">⚠️</span>
                                <div>
                                    <p className="text-sm font-semibold text-red-300">Upload Error</p>
                                    <p className="text-xs text-red-200">{uploadError}</p>
                                </div>
                            </div>
                        )}

                        {/* Error Message */}
                        {error && (
                            <div className="bg-red-900/50 border border-red-700 rounded-lg p-4 mb-4 flex gap-3">
                                <span className="text-red-400 flex-shrink-0 text-lg">⚠️</span>
                                <div>
                                    <p className="text-sm font-semibold text-red-300">Error</p>
                                    <p className="text-xs text-red-200">{error}</p>
                                </div>
                            </div>
                        )}

                        {/* Upload Area */}
                        <div className="sticky bottom-20 bg-gradient-to-b from-transparent via-black to-transparent pt-4 pb-4">
                            <div className="upload-zone" onClick={() => fileInputRef.current?.click()}>
                                <div className="text-2xl mb-2">📄</div>
                                <p className="text-sm font-semibold text-slate-300">Upload Documents</p>
                                <p className="text-xs text-slate-400 mt-1">Click to upload PDF, TXT, or DOCX files</p>
                                <input
                                    ref={fileInputRef}
                                    type="file"
                                    multiple
                                    accept=".pdf,.txt,.docx,.doc"
                                    onChange={handleFileUpload}
                                    disabled={uploading}
                                    style={{ display: 'none' }}
                                />
                                {uploading && <p className="text-xs text-yellow-400 mt-2">Uploading...</p>}
                            </div>
                        </div>

                        {/* Input Area */}
                        <div className="sticky bottom-0 bg-gradient-to-t from-black via-black to-transparent pt-4">
                            <form onSubmit={handleQuery} className="flex gap-3">
                                <input
                                    type="text"
                                    value={question}
                                    onChange={(e) => setQuestion(e.target.value)}
                                    placeholder="Ask anything about your documents..."
                                    disabled={loading}
                                    className="flex-1 bg-slate-800 border border-slate-700 rounded-full px-6 py-3 text-sm focus:outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 disabled:opacity-50 transition text-white placeholder-slate-400"
                                />
                                <button
                                    type="submit"
                                    disabled={loading || !question.trim()}
                                    className="bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-600 hover:to-yellow-700 disabled:from-slate-600 disabled:to-slate-700 text-black font-semibold rounded-full p-3 transition flex items-center justify-center"
                                >
                                    {loading ? (
                                        <span className="spin">⚡</span>
                                    ) : (
                                        <span>➤</span>
                                    )}
                                </button>
                            </form>
                            <p className="text-xs text-slate-500 mt-2 text-center">
                                Backend should be running on http://127.0.0.1:5050
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<RAGLabInterface />, document.getElementById('root'));
    </script>
</body>
</html>
